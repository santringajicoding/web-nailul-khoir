<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Offline | NK Mobile</title>
    <style>
        :root {
            --pesantren: #064e3b;
            --emas: #dfb15b;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 400px;
            padding: 40px 20px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            margin: 20px;
            border: 1px solid #f1f5f9;
            z-index: 10;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: var(--pesantren);
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 12px;
            color: #0f172a;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #64748b;
            margin: 0 0 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            background: var(--pesantren);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 100px;
            box-shadow: 0 10px 20px rgba(21, 128, 61, 0.2);
            transition: transform 0.3s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .logo {
            width: 60px;
            margin-bottom: 20px;
        }
        .bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.05;
            background-image: radial-gradient(var(--pesantren) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 1;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: #fffbeb;
            color: #b45309;
            font-size: 12px;
            font-weight: 800;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <img src="/images/logo.png" alt="Logo Nailul Khoir" class="logo">
        <div class="badge">OFFLINE MODE</div>
        <div class="icon-circle">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3" />
            </svg>
        </div>
        <h1>Ups! Koneksi Terputus</h1>
        <p>Halaman ini belum tersimpan di memori perangkat Anda. Segera hubungi Admin untuk informasi pesantren lebih lanjut.</p>
        
        <a href="https://wa.me/6288218336152" class="btn">
            Tanya Lewat WhatsApp
        </a>
        
        <div style="margin-top: 24px;">
            <a href="/" style="color: var(--pesantren); font-size: 13px; font-weight: bold; text-decoration: none;">Coba Muat Ulang</a>
        </div>
    </div>
</body>
</html>
